<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blur filter for the glow effect -->
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
    </filter>
    <filter id="blur-subtle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur3"/>
    </filter>
    
    <!-- Geist Mono approximation using system monospace -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap');
      .vision-text {
        font-family: 'Geist Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-weight: 500;
        letter-spacing: 0.15em;
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- Outermost blur layer (most diffuse glow) -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.15)"
    text-anchor="middle"
    filter="url(#blur-glow)">
    Vision
  </text>
  
  <!-- Medium blur layer -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.25)"
    text-anchor="middle"
    filter="url(#blur-medium)">
    Vision
  </text>
  
  <!-- Subtle blur layer -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.4)"
    text-anchor="middle"
    filter="url(#blur-subtle)">
    Vision
  </text>
  
  <!-- Sharp text on top (slightly transparent for blend) -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.9)"
    text-anchor="middle">
    Vision
  </text>
  
  <!-- Subtle tagline -->
  <text 
    x="640" 
    y="420" 
    class="vision-text"
    font-size="24"
    fill="rgba(255,255,255,0.4)"
    text-anchor="middle"
    letter-spacing="0.3em">
    MCP SERVER MANAGEMENT
  </text>
</svg>