<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Horizontal blur filters for the glow extending left/right -->
    <filter id="h-blur-wide" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="60,0"/>
    </filter>
    <filter id="h-blur-medium" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30,0"/>
    </filter>
    <filter id="h-blur-subtle" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15,0"/>
    </filter>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap');
      .vision-text {
        font-family: 'Geist Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-weight: 500;
        letter-spacing: 0.15em;
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- Wide horizontal blur layer (outermost glow) -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.15)"
    text-anchor="middle"
    filter="url(#h-blur-wide)">
    Vision
  </text>
  
  <!-- Medium horizontal blur layer -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.25)"
    text-anchor="middle"
    filter="url(#h-blur-medium)">
    Vision
  </text>
  
  <!-- Subtle horizontal blur layer -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,0.35)"
    text-anchor="middle"
    filter="url(#h-blur-subtle)">
    Vision
  </text>
  
  <!-- Sharp text on top -->
  <text 
    x="640" 
    y="340" 
    class="vision-text"
    font-size="140"
    fill="rgba(255,255,255,1)"
    text-anchor="middle">
    Vision
  </text>
  
  <!-- Subtle tagline -->
  <text 
    x="640" 
    y="420" 
    class="vision-text"
    font-size="24"
    fill="rgba(255,255,255,0.4)"
    text-anchor="middle"
    letter-spacing="0.3em">
    MCP SERVER MANAGEMENT
  </text>
</svg>