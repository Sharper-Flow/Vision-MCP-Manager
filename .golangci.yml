version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Exclude errcheck in test files - tests often ignore errors intentionally
      - path: _test\.go
        linters:
          - errcheck
      # Exclude unused in test files - test helpers may be unused
      - path: _test\.go
        linters:
          - unused
