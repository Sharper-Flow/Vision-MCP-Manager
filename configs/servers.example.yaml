# Vision Server Registry
# Location: ~/.config/vision/servers.yaml
#
# This file defines all MCP servers available on this machine.
# Each server gets a dedicated port for security isolation.
#
# Port allocation: 6276-6325 (Management API uses 6275)

servers:
  #############################################################################
  # STDIO SERVERS (Most Common)
  # Vision spawns these as subprocesses and bridges stdio <-> HTTP
  #############################################################################

  # Time server - provides current time tools
  # Install: npx -y @anthropic/mcp-time (auto-installed on first run)
  time:
    port: 6276
    transport: stdio          # Default, can be omitted
    command: npx
    args: ["-y", "@anthropic/mcp-time"]
    autostart: true
    restart_policy: always
    max_restarts: 5

  # Context7 - library documentation lookup
  # Install: npx -y @upstash/context7-mcp
  # Get a free API key at https://context7.com/dashboard
  # Best practice: Put API key directly here (this file is local, never committed)
  context7:
    port: 6277
    command: npx              # transport: stdio is implied when command is set
    args: ["-y", "@upstash/context7-mcp", "--api-key", "your-api-key-here"]
    autostart: true
    restart_policy: on-failure
    max_restarts: 3

  # Filesystem server - file operations
  # Install: npx -y @anthropic/mcp-filesystem
  # Note: Requires allowed_directories configuration
  filesystem:
    port: 6278
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-filesystem"
      - "--allowed-directories"
      - "${HOME}/dev"
      - "${HOME}/projects"
    autostart: false          # Enable manually when needed
    restart_policy: on-failure

  # Example: Python-based MCP server via uvx
  # kagi:
  #   port: 6279
  #   command: uvx
  #   args: ["kagimcp"]
  #   env:
  #     KAGI_API_KEY: "your-kagi-api-key-here"
  #   autostart: true
  #   availability_profile: networked
  #   shared_read_only_tools: ["kagi_search_fetch", "kagi_summarizer"]

  #############################################################################
  # MANAGED NATIVE HTTP (Playwright system default)
  # Vision owns one loopback backend process and preserves native MCP sessions.
  #############################################################################

  # playwright:
  #   port: 6287                         # Stable external Vision endpoint
  #   transport: managed-http
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@playwright/mcp@0.0.77"
  #     - "--browser"
  #     - "chromium"                    # Playwright-managed Chrome/headless shell
  #     - "--headless"
  #     - "--isolated"                  # One BrowserContext per MCP session
  #     - "--host"
  #     - "127.0.0.1"
  #     - "--allowed-hosts"
  #     - "127.0.0.1:16287"             # Exact host:port required
  #     - "--port"
  #     - "16287"
  #   url: "http://127.0.0.1:16287/mcp" # Internal endpoint; never advertise
  #   autostart: true
  #   restart_policy: on-failure
  #   max_sessions: 6
  #   session_timeout: 30m               # Application activity, not SSE

  #############################################################################
  # HTTP SERVERS (Native Streamable HTTP)
  # Vision proxies to these - no subprocess spawning
  #############################################################################

  # Example: Remote MCP server already exposing Streamable HTTP
  # remote-api:
  #   port: 6280
  #   transport: http
  #   url: "http://internal-server:8080/mcp"
  #   headers:                 # Optional: headers to forward
  #     Authorization: "Bearer ${API_TOKEN}"
  #   autostart: true          # Just means "start proxying on daemon start"

  #############################################################################
  # SSE SERVERS (Legacy - Backwards Compatibility)
  # For older MCP servers using the deprecated SSE transport
  #############################################################################

  # Example: Legacy SSE server
  # legacy-server:
  #   port: 6281
  #   transport: sse
  #   url: "http://legacy-host:8080"
  #   autostart: false

  #############################################################################
  # STATEFUL SERVERS (Process-per-Session)
  # For servers where each client needs isolated state
  #############################################################################

  # Example: Stateful server that needs process isolation
  # stateful-db:
  #   port: 6282
  #   command: npx
  #   args: ["-y", "@example/stateful-mcp"]
  #   stateful: true           # Spawn new process per session
  #   session_timeout: 5m      # Kill idle sessions after 5 minutes
  #   max_sessions: 10         # Limit concurrent sessions
  #
  # Availability tuning notes:
  # - `availability_profile: networked` applies stronger timeout/retry/circuit defaults
  # - `shared_read_only_tools` opt specific tool names into cross-session coalescing/cache
  # - `max_in_flight_requests` caps real downstream work per server

  #############################################################################
  # SLOT GROUPS (Transparent Load-Balanced Pools)
  # Define a pool of identical servers behind one virtual port.
  # Vision routes each session to the least-loaded healthy slot.
  #############################################################################

  # Rollback/alternative: 4-slot stateful-stdio Playwright pool
  # Prefer managed-http above for the normal system default.
  #
  # slot_groups:
  #   playwright:
  #     template: playwright-slot       # Synthesized names: playwright-slot-1, -2, -3, -4
  #     base_port: 6284                 # First slot port; subsequent = 6285, 6286, 6287
  #     count: 4                        # Number of identical slots (minimum: 2)
  #     group_port: 6283                # Virtual endpoint agents connect to
  #     defaults:
  #       command: npx
  #       args: ["-y", "@playwright/mcp@0.0.77", "--browser", "chromium", "--headless", "--isolated"]
  #       autostart: true
  #       stateful: true               # Each slot runs its own subprocess
  #       max_sessions: 1              # One session per slot (one browser context)
  #       session_timeout: 30m
  #       session_ttl: 2h
  #
  # In your OpenCode config, point at the virtual group port:
  #   "playwright": { "type": "remote", "url": "http://localhost:6283/mcp" }
  #
  # Check slot status via admin API:
  #   curl http://localhost:6275/v1/slots
  #   curl http://localhost:6275/v1/slots/playwright

# Slot groups are preserved on config save; synthesized slot entries are not
# persisted. You can safely reload after editing slot_groups.

# Global supervision settings
supervision:
  # How often to check server health
  health_check_interval: 30s
  
  # Time to wait for graceful shutdown
  shutdown_timeout: 10s
  
  # Time to wait before restarting a crashed server
  restart_delay: 1s
  
  # Maximum restart delay (for exponential backoff)
  max_restart_delay: 60s
