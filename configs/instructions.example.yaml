# Vision Tool Guidance Configuration
# Copy to ~/.config/vision/instructions.yaml and customize
#
# This file provides AI agents with guidance on which tools to use for different tasks.
# The vision_guidance tool returns this information to help agents make better tool choices.
#
# IMPORTANT: Tool names in `guidance` and `examples` strings should be the
# AGENT-FACING FUNCTION NAMES, not MCP server registry names. In OpenCode-style
# runtimes, function names are typically `mcp_*` CamelCase (e.g.
# `mcp_KagiKagiSearchFetch`, `mcp_Context7QueryDocs`). Registry names like
# `kagi_search_fetch` or `context7_query-docs` are what Vision uses internally
# (and what appears in `shared_read_only_tools` config), but agents that try to
# invoke those literal strings will fail with `Model tried to call unavailable
# tool 'X'`. When in doubt, instruct agents to look up the function name in
# their own tool schema before calling.

# Global guidance that applies to all tool selection decisions
global_guidance: |
  When selecting tools for a task, prefer purpose-built tools over general-purpose ones.
  For web searches, use Kagi. For documentation, use Context7. For code examples, use grep.app.
  Only use browser automation tools (like Playwright) for actual browser automation tasks,
  not for general web browsing or research.

# Server-level guidance (applies to all tools from that MCP server)
servers:
  # Kagi - Web search and summarization
  kagi:
    priority: high
    guidance: |
      Kagi is the preferred tool for web searches and research.
      Use the Kagi search-fetch tool (typical function name: `mcp_KagiKagiSearchFetch`) for finding current information, news, and general web queries.
      Use the Kagi summarizer (typical function name: `mcp_KagiKagiSummarizer`) for summarizing web pages and documents.
    prefer_for:
      - web search
      - research
      - current information
      - news lookup
      - finding articles
    avoid_for:
      - code documentation (use context7)
      - code examples (use grep.app)
    examples:
      - "Search for recent AI developments: mcp_KagiKagiSearchFetch queries=['recent AI breakthroughs 2024']"
      - "Summarize a webpage: mcp_KagiKagiSummarizer url='https://example.com/article'"

  # Context7 - Library and framework documentation
  context7:
    priority: high
    guidance: |
      Context7 is the preferred tool for programming library and framework documentation.
      First use the Context7 resolve-library-id tool (typical function name: `mcp_Context7ResolveLibraryId`) to find the correct library ID, then query-docs (typical function name: `mcp_Context7QueryDocs`) for specific questions.
      Best for API references, usage patterns, and official documentation.
    prefer_for:
      - library documentation
      - API reference
      - framework docs
      - package documentation
      - programming questions about specific libraries
    avoid_for:
      - general web search
      - current events
      - non-programming topics
    examples:
      - "Find React docs: mcp_Context7ResolveLibraryId libraryName='react' query='hooks'"
      - "Query Next.js routing: mcp_Context7QueryDocs libraryId='/vercel/next.js' query='app router'"

  # gh_grep - Official Grep by Vercel MCP for code search across GitHub
  gh_grep:
    priority: high
    guidance: |
      Grep by Vercel searches public code on GitHub for real-world usage examples.
      Use searchGitHub (typical function name: `mcp_GhGrepSearchGitHub`) to find how others implement specific patterns or use APIs.
      Great for finding examples when documentation is unclear.
    prefer_for:
      - code examples
      - implementation patterns
      - real-world usage
      - finding how APIs are used in practice
    avoid_for:
      - documentation (use context7)
      - web search (use kagi)
    examples:
      - "Find TypeScript examples: mcp_GhGrepSearchGitHub query='useEffect cleanup' language=['TypeScript']"
      - "Search specific repo: mcp_GhGrepSearchGitHub query='authentication' repo='facebook/react'"

  # Firecrawl - Web scraping and extraction
  firecrawl:
    priority: medium
    guidance: |
      Firecrawl is for structured web scraping and data extraction.
      Use the Firecrawl scrape tool (typical function name: `mcp_FirecrawlFirecrawlScrape`) for single pages, firecrawl_search for finding content.
      Prefer Kagi for simple searches; use Firecrawl when you need to extract structured data.
    prefer_for:
      - web scraping
      - structured data extraction
      - crawling websites
      - extracting specific content from pages
    avoid_for:
      - simple web searches (use kagi)
      - documentation lookup (use context7)

  # Playwright - Browser automation (if configured)
  playwright:
    priority: low
    guidance: |
      Playwright is for browser automation, E2E testing, and interactive web tasks.
      DO NOT use for general web browsing, research, or fetching content.
      Only use when you need to interact with a page (click, fill forms, etc.).
    prefer_for:
      - browser automation
      - E2E testing
      - filling out forms
      - clicking buttons
      - interactive web tasks
      - screenshots of rendered pages
    avoid_for:
      - web search (use kagi)
      - fetching page content (use firecrawl or fetch)
      - research (use kagi)
      - documentation (use context7)
    examples:
      - "Only use for automation: 'Click the login button and fill the form'"
      - "NOT for: 'Search the web for information about X'"

  # arXiv - Academic paper search
  arxiv-mcp:
    priority: medium
    guidance: |
      Use for searching and reading academic papers from arXiv.
      Best for AI/ML research, computer science papers, and academic references.
    prefer_for:
      - academic papers
      - research papers
      - AI/ML publications
      - scientific literature
    avoid_for:
      - general web content
      - non-academic information

  # Fetch - Simple HTTP fetching
  fetch-mcp:
    priority: medium
    guidance: |
      Simple HTTP fetching for when you know the exact URL.
      Use fetch_markdown for readable content, fetch_json for API responses.
      Prefer Firecrawl scrape (typical function name: `mcp_FirecrawlFirecrawlScrape`) for complex pages or when you need better parsing.
    prefer_for:
      - fetching known URLs
      - simple API requests
      - getting raw content
    avoid_for:
      - web search (use kagi)
      - complex web pages (use firecrawl)

# Tool-level guidance (for specific tools across any server)
tools:
  # Override guidance for specific tools if needed
  mcp_webfetch:
    priority: medium
    guidance: |
      Basic URL fetching. Use for simple page retrieval when you have a specific URL.
      For better parsing and structured extraction, prefer Firecrawl scrape (typical function name: `mcp_FirecrawlFirecrawlScrape`).
    prefer_for:
      - simple URL fetching
      - quick content retrieval
    avoid_for:
      - complex pages
      - structured extraction
